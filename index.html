<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scratch Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 9vh 16px 24px;
      background: radial-gradient(ellipse at 50% 40%, #33190b 0%, #241006 70%);
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
    }

    .logo {
      width: 180px;
      height: auto;
    }

    .headline {
      margin: 32px 0 22px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .card {
      position: relative;
      width: 300px;
      max-width: 100%;
      height: 240px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      user-select: none;
    }

    /* Bottom layer — the revealed content */
    .card-reveal {
      position: absolute;
      inset: 0;
      background: #b48a6a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
    }

    .card-reveal .label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #5a3520;
    }

    .card-reveal .prize {
      font-weight: 700;
      color: #1f0e05;
      line-height: 1.35;
    }

    .card-reveal .author {
      font-size: 11px;
      font-style: italic;
      color: #5a3520;
    }

    /* Top layer — the scratch canvas */
    canvas {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      border-radius: 14px;
      touch-action: none;
    }
  </style>
</head>
<body>

  <img class="logo" src="logo.svg" alt="Асарел-Медет АД" />

  <h1 class="headline">Какво предстои днес?</h1>

  <div class="card">
    <div class="card-reveal">
      <span class="label">Мисъл на деня</span>
      <span class="prize" id="prizeText"></span>
      <span class="author" id="authorText"></span>
    </div>
    <canvas id="scratchCanvas"></canvas>
  </div>

  <script src="quotes.js"></script>
  <script>
    // In quotes.js, em dash (—) is reserved solely as the author separator;
    // any dash inside the quote text itself is a plain en dash (–). So a
    // straight split on " — " is unambiguous.
    const rawQuote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    const [quoteText, author] = rawQuote.split(' — ');
    const authorText = author ? '— ' + author : '';

    const prizeEl = document.getElementById('prizeText');
    prizeEl.textContent = quoteText;
    prizeEl.style.fontSize =
      quoteText.length > 140 ? '13px' :
      quoteText.length > 100 ? '15px' :
      quoteText.length > 60  ? '17px' :
      quoteText.length > 30  ? '19px' : '22px';

    document.getElementById('authorText').textContent = authorText;

    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    const card = canvas.closest('.card');

    // Match canvas size to card
    canvas.width = card.offsetWidth;
    canvas.height = card.offsetHeight;

    // Draw the copper scratch surface
    const w = canvas.width;
    const h = canvas.height;
    const base = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.7);
    base.addColorStop(0, '#e0a07a');
    base.addColorStop(0.55, '#a8653f');
    base.addColorStop(1, '#7a4127');
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, w, h);

    // Diagonal metallic sheen
    [[0, 0, w, h], [w, 0, 0, h]].forEach(([x0, y0, x1, y1]) => {
      const sheen = ctx.createLinearGradient(x0, y0, x1, y1);
      sheen.addColorStop(0, 'rgba(255,220,190,0)');
      sheen.addColorStop(0.5, 'rgba(255,220,190,0.18)');
      sheen.addColorStop(1, 'rgba(255,220,190,0)');
      ctx.fillStyle = sheen;
      ctx.fillRect(0, 0, w, h);
    });

    // Swipe-hand hint icon
    const handSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -7 26 31" fill="none" stroke="#3a1d0e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 -3h5M3 -5l-2 2 2 2M10 -3h5M13 -5l2 2-2 2"/>
      <path d="M22 14a8 8 0 0 1-8 8"/><path d="M18 11v-1a2 2 0 0 0-4 0"/><path d="M14 10V9a2 2 0 0 0-4 0v1"/>
      <path d="M10 9.5V4a2 2 0 0 0-4 0v10"/>
      <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
    </svg>`;
    const hand = new Image();
    hand.onload = () => {
      const size = 64;
      ctx.save();
      ctx.globalCompositeOperation = 'source-atop';
      ctx.drawImage(hand, (w - size) / 2, (h - size) / 2 - 4, size, size * 31 / 26);
      ctx.restore();
    };
    hand.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(handSvg);

    // Erase pixels using destination-out
    ctx.globalCompositeOperation = 'destination-out';

    let isScratching = false;
    let lastPos = null;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches ? e.touches[0] : e;
      return {
        x: src.clientX - rect.left,
        y: src.clientY - rect.top,
      };
    }

    function scratch(e) {
      if (!isScratching) return;
      e.preventDefault();
      const pos = getPos(e);

      ctx.lineWidth = 90;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      if (lastPos) {
        ctx.moveTo(lastPos.x, lastPos.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else {
        ctx.arc(pos.x, pos.y, 45, 0, Math.PI * 2);
        ctx.fill();
      }

      lastPos = pos;
    }

    // Mouse events
    canvas.addEventListener('mousedown', (e) => { isScratching = true; lastPos = null; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    canvas.addEventListener('mouseup', () => { isScratching = false; lastPos = null; });
    canvas.addEventListener('mouseleave', () => { isScratching = false; lastPos = null; });

    // Touch events
    canvas.addEventListener('touchstart', (e) => { isScratching = true; lastPos = null; scratch(e); }, { passive: false });
    canvas.addEventListener('touchmove', scratch, { passive: false });
    canvas.addEventListener('touchend', () => { isScratching = false; lastPos = null; });
  </script>

</body>
</html>
