<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scratch Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 9vh 16px 24px;
      background: radial-gradient(ellipse at 50% 40%, #33190b 0%, #241006 70%);
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
    }

    /* Keep content hidden until fonts, logo and scratch layer are ready,
       then fade it in together to avoid a flash on load */
    body > * {
      transition: opacity 0.3s ease;
    }

    body:not(.ready) > * {
      opacity: 0;
    }

    .logo {
      width: 180px;
      height: auto;
    }

    .headline {
      margin: 32px 0 22px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .card {
      position: relative;
      width: 300px;
      max-width: 100%;
      height: 240px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      user-select: none;
    }

    /* Bottom layer — the revealed content */
    .card-reveal {
      position: absolute;
      inset: 0;
      background: #b48a6a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
    }

    .card-reveal .label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #5a3520;
    }

    .card-reveal .prize {
      font-weight: 700;
      color: #1f0e05;
      line-height: 1.35;
    }

    .card-reveal .author {
      font-size: 11px;
      font-style: italic;
      color: #5a3520;
    }

    /* Top layer — the scratch canvas */
    canvas {
      position: absolute;
      inset: 0;
      cursor: crosshair;
      border-radius: 14px;
      touch-action: none;
    }
  </style>
</head>
<body>

  <img class="logo" src="logo.svg" width="251" height="101" alt="Асарел-Медет АД" />

  <h1 class="headline">Какво предстои днес?</h1>

  <div class="card">
    <div class="card-reveal">
      <span class="label">Мисъл на деня</span>
      <span class="prize" id="prizeText"></span>
      <span class="author" id="authorText"></span>
    </div>
    <canvas id="scratchCanvas"></canvas>
  </div>

  <script src="quotes.js"></script>
  <script>
    // In quotes.js, em dash (—) is reserved solely as the author separator;
    // any dash inside the quote text itself is a plain en dash (–). So a
    // straight split on " — " is unambiguous.
    const rawQuote = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    const [quoteText, author] = rawQuote.split(' — ');
    const authorText = author ? '— ' + author : '';

    const prizeEl = document.getElementById('prizeText');
    prizeEl.textContent = quoteText;
    prizeEl.style.fontSize =
      quoteText.length > 140 ? '13px' :
      quoteText.length > 100 ? '15px' :
      quoteText.length > 60  ? '17px' :
      quoteText.length > 30  ? '19px' : '22px';

    document.getElementById('authorText').textContent = authorText;

    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    const card = canvas.closest('.card');

    // Match canvas size to card
    canvas.width = card.offsetWidth;
    canvas.height = card.offsetHeight;

    // Draw the copper scratch surface — diamond gradient #D48252 → #874D2C
    const w = canvas.width;
    const h = canvas.height;
    const from = [0xd4, 0x82, 0x52];
    const to = [0x87, 0x4d, 0x2c];
    const surface = ctx.createImageData(w, h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const t = Math.min(1, Math.abs(x - w / 2) / (w / 2) + Math.abs(y - h / 2) / (h / 2));
        const i = (y * w + x) * 4;
        surface.data[i] = from[0] + (to[0] - from[0]) * t;
        surface.data[i + 1] = from[1] + (to[1] - from[1]) * t;
        surface.data[i + 2] = from[2] + (to[2] - from[2]) * t;
        surface.data[i + 3] = 255;
      }
    }
    ctx.putImageData(surface, 0, 0);

    // Swipe-hand hint icon
    const hand = new Image();
    const handReady = new Promise((resolve) => {
      hand.onload = () => {
        const iw = 72;
        const ih = iw * hand.naturalHeight / hand.naturalWidth;
        ctx.save();
        ctx.globalCompositeOperation = 'source-atop';
        ctx.drawImage(hand, (w - iw) / 2, (h - ih) / 2, iw, ih);
        ctx.restore();
        resolve();
      };
      hand.onerror = resolve;
    });
    hand.src = 'hand.svg';

    // Reveal the page once everything is painted (or after 2s at most)
    const logoReady = document.querySelector('.logo').decode().catch(() => {});
    Promise.race([
      Promise.all([document.fonts.ready, logoReady, handReady]),
      new Promise((resolve) => setTimeout(resolve, 2000)),
    ]).then(() => document.body.classList.add('ready'));

    // Erase pixels using destination-out
    ctx.globalCompositeOperation = 'destination-out';

    let isScratching = false;
    let lastPos = null;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const src = e.touches ? e.touches[0] : e;
      return {
        x: src.clientX - rect.left,
        y: src.clientY - rect.top,
      };
    }

    function scratch(e) {
      if (!isScratching) return;
      e.preventDefault();
      const pos = getPos(e);

      ctx.lineWidth = 90;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      if (lastPos) {
        ctx.moveTo(lastPos.x, lastPos.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else {
        ctx.arc(pos.x, pos.y, 45, 0, Math.PI * 2);
        ctx.fill();
      }

      lastPos = pos;
    }

    // Mouse events
    canvas.addEventListener('mousedown', (e) => { isScratching = true; lastPos = null; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    canvas.addEventListener('mouseup', () => { isScratching = false; lastPos = null; });
    canvas.addEventListener('mouseleave', () => { isScratching = false; lastPos = null; });

    // Touch events
    canvas.addEventListener('touchstart', (e) => { isScratching = true; lastPos = null; scratch(e); }, { passive: false });
    canvas.addEventListener('touchmove', scratch, { passive: false });
    canvas.addEventListener('touchend', () => { isScratching = false; lastPos = null; });
  </script>

</body>
</html>
